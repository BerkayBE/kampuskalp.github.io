<title>MunzurKALP Panelleri</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Düzen: sol menü + içerik. Kartsız; bölümler çizgiyle ayrılır. Tek vurgu: lacivert. Tek tema: beyaz. */
:root{
  --bg:#FFFFFF; --soft:#F5F6F8; --ink:#1B2430; --muted:#5C6675; --line:#DDE1E7; --line-2:#C5CBD4;
  --accent:#0A2647; --base:#CBD2DC;
  --ok:#1E7B4B; --warn:#A35F00; --crit:#B3261E; --info:#3F6A9A;
  --font:'IBM Plex Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font);margin:0;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{flex:none;vertical-align:-3px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* kabuk */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{border-right:1px solid var(--line);padding:24px 0 20px max(20px,env(safe-area-inset-left,0px));padding-right:20px;display:flex;flex-direction:column;gap:28px;position:sticky;top:0;align-self:start;height:100vh}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;min-width:0}
.brand img,.brand svg.mark{height:36px;width:auto;max-width:96px;object-fit:contain;display:block;flex:none}
.brand b{display:block;font-size:16px;font-weight:600;line-height:1.2}
.brand small{display:block;color:var(--muted);font-size:12.5px;line-height:1.3}
.univ{max-height:44px;max-width:100%;object-fit:contain;object-position:left;margin-top:-12px}
.nav{display:flex;flex-direction:column}
.ni{display:block;padding:9px 0 9px 12px;margin-left:-12px;border-left:2px solid transparent;text-decoration:none;color:var(--muted);font-weight:500}
.ni:hover{color:var(--ink)}
.ni[aria-current="page"]{color:var(--accent);border-left-color:var(--accent);font-weight:600}
.nav .gap{height:1px;background:var(--line);margin:12px 0}
.clock-sel{margin-top:auto;display:grid;gap:4px;color:var(--muted);font-size:12.5px}
.clock-sel select{width:100%}
.main{padding:32px max(32px,env(safe-area-inset-right,0px)) 0 40px;min-width:0;max-width:1180px;width:100%}
.page-h{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:28px}
.page-h h1{font-size:26px;font-weight:600;line-height:1.2}
.page-h p{color:var(--muted);margin-top:4px}
.hd-r{display:flex;align-items:center;gap:14px;color:var(--muted)}
.hd-r .clock{font-size:20px;font-weight:500;color:var(--ink)}
.foot{padding-block:48px 32px;color:var(--muted);font-size:12.5px}

/* bölümler: kart değil, çizgiyle ayrılmış alanlar */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:40px 48px}
.card{grid-column:span var(--span,6);min-width:0}
.bare{grid-column:span 12;min-width:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding-bottom:10px;border-bottom:1px solid var(--ink)}
.card-h h2{font-size:15px;font-weight:600}
.card-h .meta{color:var(--muted);font-size:12.5px;text-align:right}
.card-b{min-width:0}
@media (max-width:1100px){.card{grid-column:span 12}}

/* özet şeridi */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.kpi{padding:16px 20px;min-width:0}
.kpi:first-child{padding-left:0}
.kpi+.kpi{border-left:1px solid var(--line)}
.kpi span{display:block;font-size:12.5px;color:var(--muted)}
.kpi b{display:block;font-size:24px;font-weight:600;line-height:1.25;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted);font-size:12.5px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi:nth-child(odd){padding-left:0;border-left:0}.kpi:nth-child(n+3){border-top:1px solid var(--line)}}

/* durum: yalnızca nokta ve metin */
.st{display:inline-flex;align-items:center;gap:7px;font-size:13px;white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--line-2);flex:none}
.st.ok::before{background:var(--ok)} .st.warn::before{background:var(--warn)} .st.crit::before{background:var(--crit)} .st.info::before{background:var(--info)}
.st.crit{color:var(--crit);font-weight:500}

/* düğmeler */
.btn{display:inline-flex;align-items:center;gap:6px;font-weight:500;font-size:13px;padding:7px 14px;border:1px solid var(--line-2);background:var(--bg);color:var(--ink);border-radius:2px;cursor:pointer;text-decoration:none;line-height:1.2}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 88%,#fff)}
.btn.danger{color:var(--crit)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.actions{display:flex;gap:6px;flex-wrap:wrap}

/* tablolar ve listeler */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:12.5px;color:var(--muted);text-align:left;font-weight:500;padding:10px 16px 8px 0;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 16px 12px 0;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.r,.tbl th.r{text-align:right}
.tbl th:last-child,.tbl td:last-child{padding-right:0}
.tbl .sub{display:block;color:var(--muted);font-size:12.5px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:16px;justify-content:space-between;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list li>div:first-child{min-width:0}
.list li>.actions{flex-wrap:nowrap;flex:none}
.list .t{font-weight:500}
.list .s{color:var(--muted);font-size:12.5px}
.empty{padding:20px 0;color:var(--muted)}
.fn,.note{color:var(--muted);font-size:12.5px;max-width:64ch;margin-top:14px}

/* çubuk ve grafik */
.bar-row{display:grid;grid-template-columns:minmax(70px,150px) minmax(0,1fr) 92px;gap:16px;align-items:center;margin:14px 0}
.bar-row .lab{font-size:13px}
.bar-row .val{text-align:right;font-variant-numeric:tabular-nums;font-size:13px;font-weight:500}
.bar{height:8px;background:var(--soft);position:relative;overflow:hidden}
.bar .base{position:absolute;inset:0 auto 0 0;background:var(--base)}
.bar .act{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.legend{display:flex;gap:4px 20px;flex-wrap:wrap;color:var(--muted);font-size:12.5px;margin-top:10px}
.legend i{display:inline-block;width:10px;height:3px;margin-right:7px;vertical-align:3px}
.stepper{display:inline-flex;align-items:center;gap:8px}
.stepper b{min-width:48px;text-align:center;font-weight:500;font-variant-numeric:tabular-nums}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font:11px var(--font)}
.chart .gl{stroke:var(--line);stroke-width:1}

/* formlar */
.field{display:grid;gap:4px;min-width:0}
.field>span{font-size:12.5px;color:var(--muted)}
input,select,textarea{background:var(--bg);border:1px solid var(--line-2);border-radius:2px;padding:7px 10px;width:100%;min-width:0}
input:hover,select:hover,textarea:hover{border-color:var(--muted)}
select.inl{width:auto;padding:4px 8px;font-size:13px}
input[type="checkbox"]{width:auto;accent-color:var(--accent)}
input[type="color"]{padding:2px;height:36px;width:64px}
textarea{resize:vertical;min-height:84px}
.form{display:grid;gap:14px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.check{display:flex;gap:8px;align-items:center;font-size:13px}
.subtabs{display:flex;gap:4px 24px;flex-wrap:wrap;margin-bottom:32px;border-bottom:1px solid var(--line)}
.subtabs button{border:0;border-bottom:2px solid transparent;background:none;padding:8px 0;margin-bottom:-1px;font-weight:500;cursor:pointer;color:var(--muted)}
.subtabs button:hover{color:var(--ink)}
.subtabs button[aria-pressed="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.logo-prev{height:64px;min-width:64px;max-width:200px;border:1px dashed var(--line-2);display:grid;place-items:center;padding:8px;background:var(--soft)}
.logo-prev img,.logo-prev svg{max-height:48px;max-width:100%}

/* ana sayfa */
.rolelist{list-style:none;margin:0 0 32px;padding:0;border-top:1px solid var(--ink)}
.rolelist li{border-bottom:1px solid var(--line)}
.rolelist a{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;padding:18px 0;text-decoration:none}
.rolelist .rn{font-size:16px;font-weight:600}
.rolelist .rb{color:var(--muted)}
.rolelist a:hover .rn{color:var(--accent);text-decoration:underline;text-underline-offset:4px}

/* pencere ve bildirim */
.modal{position:fixed;inset:0;background:rgba(27,36,48,.45);display:grid;place-items:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--bg);width:100%;max-width:680px;max-height:100%;overflow:auto;padding:28px;display:grid;gap:18px;border-top:3px solid var(--accent)}
.sheet h2{font-size:20px;font-weight:600}
.frame{aspect-ratio:16/9;max-width:100%;background:#0B1226;position:relative;overflow:hidden;display:grid;place-items:center}
.frame>svg{width:100%;height:100%;display:block}
.frame.locked>svg{filter:blur(16px) brightness(.8)}
.frame .lock{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:10px;color:#C9D4E8;text-align:center;padding:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 24px;font-size:13.5px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:10px 16px;border-radius:2px;font-size:13px;z-index:60;max-width:calc(100% - 32px)}

/* dar ekran: menü üste geçer */
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:16px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));gap:12px}
  .univ{margin-top:0}
  .nav{flex-direction:row;overflow-x:auto;gap:20px;scrollbar-width:none}
  .nav .gap{display:none}
  .ni{padding:8px 0;margin:0;border-left:0;border-bottom:2px solid transparent;white-space:nowrap}
  .ni[aria-current="page"]{border-bottom-color:var(--accent)}
  .clock-sel{margin:0;padding-bottom:12px;grid-template-columns:auto 1fr;align-items:center;gap:10px}
  .main{padding:24px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
  .grid{gap:32px}
  .row2{grid-template-columns:1fr}
  .rolelist a{grid-template-columns:1fr;gap:2px}
  .bar-row{grid-template-columns:78px minmax(0,1fr) 78px;gap:10px}
  .card-h{flex-wrap:wrap;gap:2px 16px}
  .card-h .meta{text-align:left}
}
@media (prefers-reduced-motion:no-preference){.btn,.ni{transition:border-color .15s,color .15s}}
</style>
<div id="app"></div>
<div id="toast" role="status" hidden></div>
<script>

(function () {

document.documentElement.lang = 'tr';

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');

const fmt = (n, d = 0) => Number(n).toLocaleString('tr-TR', { minimumFractionDigits: d, maximumFractionDigits: d });

function hash(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

const ICONS = {

const ROLES = [

const DEFAULTS = {

  buildings: [

    { id: 'rek', name: 'Rektörlük Binası' }, { id: 'atl', name: 'Milli Teknoloji Atölyesi' }
  ],

/* ---------- 4. Simülasyon ----------
   Oda durum makinesi (sunumdaki durumlar): kullanımda, boş-bekleme, otomatik kapatıldı,
   manuel (2 saat), arıza (güvenli varsayılan), ve güvenlik modunda alarm / izinli çalışma. */
const roomById = id => CFG.rooms.find(r => r.id === id);
const buildingName = id => (CFG.buildings.find(b => b.id === id) || {}).name || id;
const floorName = f => (f === 0 ? 'Zemin kat' : f + '. kat');
const isL1 = r => Number(r.level) === 1;

function activePermit(roomId, t) {
  return RT.requests.find(q => q.type === 'mesai' && q.status === 'onaylandi' && q.room === roomId && t >= toMin(q.start) && t < toMin(q.end));
}

function roomState(room, tod, day = dayKey(0)) {
  const T = TYPES[room.type] || TYPES.derslik, P = CFG.params;
  const base = T.base;
  const slot = Math.floor(tod / 30), seed = room.id + '|' + day + '|' + slot;
  const r1 = rnd(seed + 'a'), r2 = rnd(seed + 'b'), r3 = rnd(seed + 'c');
  const L1 = isL1(room), today = day === dayKey(0), mode = today ? RT.secMode[room.building] : null;
  const work = mode === 'acik' ? false : mode === 'kapali' ? true : isWork(tod);
  const inSched = T.always || T.hours.some(([s, e]) => tod >= s && tod < e);
  const st = { phase: 'kapali', people: L1 ? 0 : null, kw: base * .04, baselineKw: base * .04, remaining: 0, det: null, conf: null };

  if (T.always) { st.phase = 'surekli'; st.kw = st.baselineKw = base * (.9 + .2 * r3); st.people = null; }
  else if (inSched) {
    if (r1 < T.p) {
      st.phase = 'dolu'; st.people = L1 ? Math.max(1, Math.round(room.capacity * (.2 + .65 * r2))) : 1;
      st.kw = st.baselineKw = base * (.55 + .45 * r3);
    } else {
      const empty = Math.floor(r2 * 40) + 1;
      if (empty >= P.emptyMinutes) { st.phase = 'kapandi'; st.kw = base * .05; st.baselineKw = base * .75; }
      else { st.phase = 'bekleme'; st.remaining = P.emptyMinutes - empty; st.kw = st.baselineKw = base * .75; }
    }
  } else if (r1 < .10) { st.phase = 'unutulmus'; st.kw = base * .2; st.baselineKw = base * .5; }
  else if (!work && r1 < (L1 ? .22 : .15)) {
    st.phase = 'alarm'; st.people = L1 ? 1 : null; st.kw = st.baselineKw = base * .3;
    st.det = slot * 30 + Math.floor(r2 * 25); st.conf = Math.round(86 + r3 * 12);
  }

  if (day === dayKey(0)) {
    if (st.det != null) st.det = Math.min(st.det, tod);
    const hold = RT.holds[room.id];
    if (hold && hold > tod && ['kapandi', 'bekleme'].includes(st.phase)) { st.phase = 'erteli'; st.kw = st.baselineKw = base * .6; }
    if (['alarm', 'kapali'].includes(st.phase) && activePermit(room.id, tod)) { st.phase = 'izinli'; st.people = L1 ? 1 : null; st.kw = st.baselineKw = base * .55; }
    if (RT.nodesOff[room.id]) { st.phase = 'ariza'; st.kw = st.baselineKw = base * .6; }
  }
  const sp = RT.setpoints[room.id];
  st.temp = +(sp && st.phase === 'dolu' ? sp - .5 + r3 * .8 : (T.always ? 3 + r2 * 2.5 : 18.5 + (st.phase === 'dolu' ? 3.2 : 1.2) + r3 * 1.4)).toFixed(1);
  st.co2 = Math.round(430 + (L1 && st.people ? st.people / room.capacity * 900 : 0) + r2 * 40);
  st.light = ['dolu', 'bekleme', 'erteli', 'unutulmus', 'izinli', 'ariza'].includes(st.phase);
  return st;
}
const alarmKey = (room, st, day = dayKey(0)) => room.id + '|' + day + '|' + Math.floor(st.det / 30);
const kwNow = (room, st) => st.kw * (1 + .035 * Math.sin(Date.now() / 5000 + (hash(room.id) % 7)));

const PHASE = {
  dolu: ['Kullanımda', 'ok'], bekleme: ['Boş, kapanış bekliyor', 'warn'], kapandi: ['Otomatik kapatıldı', 'info'],
  unutulmus: ['Açık unutulmuş', 'warn'], alarm: ['Alarm', 'crit'], izinli: ['İzinli çalışma', 'info'],
  erteli: ['Manuel mod', 'info'], kapali: ['Kapalı', 'neutral'], surekli: ['Sürekli yük', 'neutral'], ariza: ['Arıza (güvenli varsayılan)', 'warn']
};
const phasePill = st => pill(PHASE[st.phase][0] + (st.phase === 'bekleme' ? ` · ${st.remaining} dk` : ''), PHASE[st.phase][1]);

function totals(rooms, day, upTo = 1439) {
  let actual = 0, baseline = 0, residual = 0, idleHours = 0;
  for (const r of rooms) for (let t = 15; t <= upTo; t += 30) {
    const s = roomState(r, t, day);
    actual += s.kw * .5; baseline += s.baselineKw * .5;
    if (s.phase === 'bekleme' || s.phase === 'unutulmus') { residual += s.kw * .5; idleHours += .5; }
  }
  const saved = baseline - actual;
  return { actual, baseline, saved, residual, idleHours, capture: saved / Math.max(saved + residual, .001) * 100 };
}
function weekSeries(rooms) {
  const out = [];
  for (let i = 7; i >= 1; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const t = totals(rooms, dayKey(-i));
    out.push({ label: ['Paz', 'Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt'][d.getDay()], actual: t.actual, baseline: t.baseline });
  }
  return out;
}
function eventsFor(rooms, now, limit = 8) {
  const out = [], day = dayKey(0);
  for (let slot = Math.floor(now / 30); slot >= 0 && out.length < 80; slot--) {
    for (const r of rooms) {
      const s = roomState(r, Math.min(now, slot * 30 + 15), day);
      if (!['kapandi', 'unutulmus', 'alarm'].includes(s.phase)) continue;
      const t = Math.min(now, slot * 30 + Math.floor(rnd(r.id + day + slot + 't') * 28));
      out.push({ t, room: r, phase: s.phase });
    }
  }
  return out.sort((a, b) => b.t - a.t).slice(0, limit);
}
function eventText(e) {
  const P = CFG.params;
  if (e.phase === 'kapandi') return [`${e.room.name}: ${P.emptyMinutes} dk boş kaldı, otomatik kapatıldı`, 'info'];
  if (e.phase === 'unutulmus') return [`${e.room.name}: boşta çalışan cihaz, Telegram uyarısı gönderildi`, 'warn'];
  return [`${e.room.name}: mesai dışı hareket algılandı`, 'crit'];
}
function currentAlarms(rooms, now) {
  const day = dayKey(0), out = [];
  for (const r of rooms) {
    const s = roomState(r, now, day);
    if (s.phase === 'alarm') out.push({ room: r, st: s, key: alarmKey(r, s, day) });
  }
  return out;
}

/* ---------- 5. Grafikler ---------- */
function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(Math.max(v, 1e-9)))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }
function lineChart(series, labels, { w = 560, h = 230, unit = '', decimals = 0 } = {}) {
  const m = { l: 56, r: 12, t: 12, b: 26 }, iw = w - m.l - m.r, ih = h - m.t - m.b;
  const all = series.flatMap(s => s.data), hi = Math.max(0, ...all), lo = Math.min(0, ...all);
  const stp = niceMax(((hi - lo) || 1) / 4), max = Math.ceil(hi / stp) * stp, min = Math.floor(lo / stp) * stp, span = (max - min) || 1;
  const x = i => m.l + (labels.length === 1 ? iw / 2 : i * iw / (labels.length - 1)), y = v => m.t + ih - (v - min) / span * ih;
  let g = '';
  for (let v = min; v <= max + stp / 2; v += stp) g += `<line class="gl" x1="${m.l}" x2="${w - m.r}" y1="${y(v)}" y2="${y(v)}"/><text x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end">${fmt(v, decimals)}</text>`;
  if (min < 0) g += `<line x1="${m.l}" x2="${w - m.r}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)" stroke-width="1.2"/>`;
  const step = Math.ceil(labels.length / 8);
  labels.forEach((l, i) => { if (i % step === 0 || i === labels.length - 1) g += `<text x="${x(i)}" y="${h - 6}" text-anchor="middle">${esc(l)}</text>`; });
  const lines = series.map(s => {
    const d = s.data.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join('');
    const last = s.data.length - 1;
    return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w || 2.4}" ${s.dash ? 'stroke-dasharray="5 5"' : ''} stroke-linejoin="round" stroke-linecap="round"/>` +
      (s.end ? `<circle cx="${x(last)}" cy="${y(s.data[last])}" r="4" fill="${s.color}"/>` : '');
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(unit)} grafiği">${g}${lines}</svg>`;
}
const legend = items => `<div class="legend">${items.map(([c, t]) => `<span><i style="background:${c}"></i>${esc(t)}</span>`).join('')}</div>`;
function barRows(rows, { unit = 'kWh', max } = {}) {
  const top = max || Math.max(...rows.map(r => r.baseline || r.actual), .001);
  return rows.map(r => `<div class="bar-row"><span class="lab">${esc(r.label)}</span>
    <div class="bar" role="img" aria-label="${esc(r.label)}: ${fmt(r.actual)} ${unit}">${r.baseline != null ? `<i class="base" style="width:${r.baseline / top * 100}%"></i>` : ''}<i class="act" style="width:${r.actual / top * 100}%"></i></div>
    <span class="val">${fmt(r.actual)} ${unit}</span></div>`).join('');
}
const progress = (pct, label) => `<div class="bar" style="height:8px" role="img" aria-label="${esc(label || '')} %${pct}"><i class="act" style="width:${clamp(pct, 0, 100)}%"></i></div>`;

}

  id: 'schedule', title: 'Bugünkü derslerim', span: 12,
  meta: c => 'Ders saatinde oda kapatılmaz; müdahalede oda ' + CFG.params.manualHoldMin / 60 + ' saat manuel modda kalır',
  render: c => {
    const rows = c.panel.courses.map(k => {
      const room = roomById(k.room); if (!room) return '';
      const st = c.st(room), s = toMin(k.s), e = toMin(k.e), active = c.now >= s && c.now < e;
      const when = c.now < s ? pill('Başlamadı') : active ? pill('Devam ediyor', 'ok') : pill('Bitti');
      const held = RT.holds[room.id] > c.now;
      return `<tr><td><b>${esc(k.name)}</b><span class="sub">${esc(k.code)} · ${esc(k.s)}–${esc(k.e)}</span></td>

        <td>${when}<span class="sub">${phasePill(st)}</span></td>
        <td><div class="actions"><button class="btn sm" data-act="hold" data-room="${room.id}" ${held ? 'disabled' : ''}>${held ? 'Manuel mod açık' : 'Kapatmayı ertele'}</button>

function goalRows() {
  const m = metrics(), P = CFG.params;
  const row = (label, val, ok, target) => `<li><div><div class="t">${esc(label)}</div><div class="s">Hedef: ${esc(target)}</div></div><div style="text-align:right"><b class="num">${val}</b><div>${pill(ok ? 'Hedefte' : 'Hedef dışı', ok ? 'ok' : 'warn')}</div></div></li>`;
  return `<ul class="list">${row('Yakalanan israf oranı', '%' + fmt(m.capture), m.capture >= P.captureTarget, '%' + P.captureTarget + ' ve üzeri')}
    ${row('Yanlış kapatma (son 7 gün)', fmt(m.wrongClose), m.wrongClose < P.falseCloseTarget, 'haftada ' + P.falseCloseTarget + ' altı')}
    ${row('Alarm yakalama süresi', fmt(m.response, 1) + ' dk', m.response < P.alarmTargetMin, P.alarmTargetMin + ' dakika altı')}
    ${row('Boşta çalışan oda-saat (bugün)', fmt(m.idleHours, 1) + ' sa', m.idleHours < 6, '6 saat altı (varsayım)')}</ul>`;
}

/* Kayıtlı yapılandırma ile kayıt defterini uzlaştır (yeni widget eklenirse görünür) */
function reconcile() {
  for (const role of Object.keys(W)) {
    const p = CFG.panels[role], defs = W[role], list = (p.widgets || []).filter(w => defs.some(d => d.id === w.id));
    for (const d of defs) if (!list.some(w => w.id === d.id)) list.push({ id: d.id, visible: true, title: d.bare ? '' : d.title, span: d.span });
    p.widgets = list;
  }
}

const fld = (label, path, type = 'text', extra = '') => `<label class="field"><span>${esc(label)}</span><input type="${type}" value="${esc(getPath(CFG, path))}" data-bind="${path}" data-type="${type}" ${extra}></label>`;

function nodeInfo(r) {
  const h = hash(r.id);
  return { id: 'MK-' + r.id.toUpperCase(), room: r, fw: 'v1.4.' + (h % 4), rssi: -42 - (h % 33), uptime: 3 + (h % 41), off: !!RT.nodesOff[r.id],
    hw: isL1(r) ? 'ESP32 + Raspberry Pi kamera' : 'ESP32 (kamerasız)' };
}

function biOverview() {
  const nodes = CFG.rooms.map(nodeInfo), on = nodes.filter(n => !n.off).length;
  const down = Object.values(RT.serviceDown).filter(Boolean).length;
  const faults = RT.requests.filter(q => q.type === 'ariza' && q.status === 'bekliyor');
  return `<div class="grid">
    <div class="bare"><div class="kpis">${kpi('Çevrimiçi düğüm', on + ' / ' + nodes.length, nodes.length - on ? 'arızalı düğümde ışık açık kalır' : 'tüm düğümler yanıt veriyor')}
      ${kpi('Servisler', (CFG.services.length - down) + ' / ' + CFG.services.length, down ? 'durdurulmuş servis var' : 'hepsi çalışıyor')}
      ${kpi('Açık arıza talebi', fmt(faults.length), 'kullanıcılardan gelen')}
      ${kpi('Son veri', '12 sn', '30 sn özet, MQTT')}</div></div>
    <section class="card" style="--span:7"><header class="card-h"><h2>Servisler</h2><span class="meta">5 katmanlı mimari</span></header><div class="card-b flush"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Servis</th><th>Durum</th><th class="r">Gecikme</th><th></th></tr></thead><tbody>${CFG.services.map(s => {
      const d = RT.serviceDown[s.id];
      return `<tr><td><b>${esc(s.name)}</b><span class="sub">${esc(s.detail)}</span></td><td>${d ? pill('Durduruldu', 'crit') : pill('Çalışıyor', 'ok')}</td><td class="r num">${d || !s.ms ? '—' : s.ms + ' ms'}</td>
        <td><div class="actions"><button class="btn sm" data-act="svc-restart" data-id="${s.id}">Yeniden başlat</button><button class="btn sm" data-act="svc-toggle" data-id="${s.id}">${d ? 'Başlat' : 'Durdur'}</button></div></td></tr>`; }).join('')}</tbody></table></div></div></section>
    <section class="card" style="--span:5"><header class="card-h"><h2>Arıza talepleri</h2><span class="meta">kullanıcı bildirimleri</span></header><div class="card-b flush">${faults.length ? `<ul class="list">${faults.map(q => `<li><div><div class="t">${esc((roomById(q.room) || {}).name)}</div><div class="s">${esc(q.text)} · ${esc(q.at)}</div></div><button class="btn sm primary" data-act="decide" data-id="${q.id}" data-v="cozuldu">Çözüldü</button></li>`).join('')}</ul>` : emptyState('Açık arıza talebi yok.')}</div></section></div>`;
}

function modalHtml() {
  const m = UI.modal; if (!m) return '';
  if (m.type === 'alarm') {
    const room = roomById(m.room); if (!room) return '';
    const now = nowMin(), st = roomState(room, now), l1 = isL1(room), key = alarmKey(room, st);
    const scene = `<svg viewBox="0 0 320 180" aria-hidden="true"><rect width="320" height="180" fill="#0B1226"/><path d="M0 140h320M0 152h320" stroke="#1B2848"/><g fill="#31456F"><circle cx="168" cy="72" r="11"/><rect x="154" y="86" width="28" height="52" rx="10"/></g>${m.revealed ? `<rect x="140" y="52" width="56" height="94" fill="none" stroke="#1FBF8B" stroke-width="1.5"/><text x="140" y="46" fill="#1FBF8B" font-size="9" font-family="Inter,sans-serif">kisi 1 · %${st.conf || 90}</text>` : ''}</svg>`;
    const media = l1 ? (m.revealed ? `<div class="frame">${scene}</div><p class="muted num">Alarm karesi 1/2, şifreli saklanır, açılış kaydedildi</p>`
      : `<div class="frame locked">${scene}<div class="lock">${icon('lock', 28)}<b>Şifreli alarm karesi</b><span>Yalnızca güvenlik personeli açabilir. Açılış kaydedilir.</span><button class="btn primary" data-act="reveal" data-room="${room.id}">${icon('eye', 16)} Görüntüyü aç</button></div></div>`)
      : `<p class="note">Bu alan Seviye 0 özel alandır. Kamera yoktur; yalnızca PIR ve mmWave sensör alarmı iletilir, görüntü üretilmez.</p>`;
    const h = RT.alarms[key];
    return `<div class="modal" data-act="modal-bg"><div class="sheet" role="dialog" aria-modal="true" aria-label="Alarm ayrıntısı"><div><h2>${esc(room.name)}</h2><p class="muted">${esc(buildingName(room.building))} · ${esc(floorName(room.floor))}</p></div>
      <dl class="kv"><dt>Saat</dt><dd class="num">${hhmm(st.det ?? now)}</dd><dt>Seviye</dt><dd>${l1 ? 'Seviye 1, kamera doğrulamalı' : 'Seviye 0, yalnızca sensör'}</dd><dt>Doğrulama</dt><dd>${l1 ? 'İki ardışık kare, 30 sn · güven %' + (st.conf || 90) : 'PIR + mmWave'}</dd><dt>İzin kaydı</dt><dd>Yok</dd></dl>${media}
      <div class="actions">${h ? pill('İşlendi: ' + { devriye: 'devriye gönderildi', yanlis: 'yanlış alarm', onay: 'onaylandı' }[h.v], 'ok') : `<button class="btn primary" data-act="alarm-do" data-key="${key}" data-det="${st.det ?? now}" data-v="devriye">Devriye gönder</button><button class="btn" data-act="alarm-do" data-key="${key}" data-det="${st.det ?? now}" data-v="onay">Alarmı onayla</button><button class="btn" data-act="alarm-do" data-key="${key}" data-det="${st.det ?? now}" data-v="yanlis">Yanlış alarm</button>`}<button class="btn" data-act="modal-close">Kapat</button></div></div></div>`;
  }
  if (m.type === 'report') {
    const c = ctxFor('dekan'), rooms = facultyRooms(c), w = weekSeries(rooms);
    return `<div class="modal" data-act="modal-bg"><div class="sheet" role="dialog" aria-modal="true" aria-label="Haftalık rapor"><div><h2>Haftalık enerji raporu</h2><p class="muted">${esc(c.panel.unit)} · son 7 gün · bina ve kat bazlı</p></div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Gün</th><th class="r">Gerçekleşen</th><th class="r">Sistem olmadan</th><th class="r">Fark</th></tr></thead><tbody>${w.map(d => `<tr><td>${d.label}</td><td class="r num">${fmt(d.actual)} kWh</td><td class="r num">${fmt(d.baseline)} kWh</td><td class="r num">${fmt(d.baseline - d.actual)} kWh</td></tr>`).join('')}</tbody></table></div>
      <p class="note">Tutarlar ${fmt(CFG.params.tariff, 1)} TL/kWh varsayımıyla hesaplanır. Kişi veya oda bazlı Seviye 0 verisi içermez.</p><div class="actions"><button class="btn primary" data-act="modal-close">Kapat</button></div></div></div>`;
  }
  return '';
}
function render() {
  const y = window.scrollY, r = route();
  const view = r === 'home' ? viewHome() : r === 'bilgi-islem' ? viewBI() : viewRole(r);
  $('#app').innerHTML = `<div class="app">${sideHtml(r)}<main class="main">${view}<footer class="foot">${esc(CFG.brand.footer)}</footer></main></div>` + modalHtml();
  window.scrollTo(0, y);
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.id); toast.id = setTimeout(() => { t.hidden = true; }, 2600);
}
function applyBrand() { if (/^#[0-9a-f]{6}$/i.test(CFG.brand.accent)) document.documentElement.style.setProperty('--accent', CFG.brand.accent); }

/* ----- işlemler (data-act) ----- */
const NEW = {
  'panels.hoca.courses': () => ({ code: 'DERS-101', name: 'Yeni ders', room: CFG.rooms[0].id, s: '09:00', e: '10:50' }),
  roadmap: () => ({ id: uid('f'), name: 'Yeni faz', period: '', status: 'plan', progress: 0, desc: '' }),
  decisions: () => ({ id: uid('d'), title: 'Yeni karar', detail: '' }),
  privacy: () => ({ id: uid('p'), text: 'Yeni madde', state: 'ok' }),
  rooms: () => ({ id: uid('oda-'), name: 'Yeni alan', building: CFG.buildings[0].id, floor: 0, level: 1, type: 'derslik', capacity: 30 }),
  buildings: () => ({ id: uid('b'), name: 'Yeni bina' }),
  users: () => ({ id: uid('u'), name: 'Yeni kullanıcı', role: 'hoca', unit: '', active: true })
};
const A = {
  hold(d) { RT.holds[d.room] = nowMin() + CFG.params.manualHoldMin; audit(who(), 'oda', `${roomById(d.room).name}: kapatma ertelendi (manuel mod)`); toast('Oda manuel moda alındı, otomatik kapatma durdu'); },
  wrongclose(d) { RT.wrongClose.push({ day: dayKey(0), room: d.room }); RT.holds[d.room] = nowMin() + CFG.params.manualHoldMin; audit(who(), 'oda', `${roomById(d.room).name}: yanlış kapatma bildirildi`); toast('Bildirim alındı. Eşikler yeniden gözden geçirilecek'); },
  setpoint(d) { RT.setpoints[d.room] = clamp((RT.setpoints[d.room] || 22) + Number(d.d), 16, 28); },
  decide(d) { const q = RT.requests.find(x => x.id === d.id); if (!q) return; q.status = d.v; q.by = who();
    audit(who(), 'talep', `${reqType(q.type)} ${{ onaylandi: 'onaylandı', reddedildi: 'reddedildi', cozuldu: 'çözüldü' }[d.v]}: ${(roomById(q.room) || {}).name}`);
    toast(d.v === 'onaylandi' ? 'Onaylandı. İzin kaydı güvenlik paneline işlendi' : d.v === 'cozuldu' ? 'Arıza kaydı kapatıldı' : 'Talep reddedildi'); },
  'alarm-open'(d) { UI.modal = { type: 'alarm', room: d.room, revealed: false }; },
  'alarm-do'(d) { RT.alarms[d.key] = { v: d.v, at: nowMin(), by: who() }; if (d.det) RT.responseTimes.push(clamp(nowMin() - Number(d.det), 1, 25));
    audit(who(), 'alarm', `${{ devriye: 'Devriye gönderildi', onay: 'Alarm onaylandı', yanlis: 'Yanlış alarm olarak işaretlendi' }[d.v]}`); UI.modal = null; toast('Alarm işlendi'); },
  reveal(d) { UI.modal.revealed = true; audit(who(), 'goruntu', `${roomById(d.room).name} alarm karesi açıldı`); },
  modal(d) { UI.modal = { type: d.m }; },
  'modal-close'() { UI.modal = null; },
  decision(d) { RT.decisions[d.id] = d.v; audit(who(), 'karar', `${(CFG.decisions.find(x => x.id === d.id) || {}).title}: ${d.v === 'onay' ? 'onaylandı' : 'ertelendi'}`); toast(d.v === 'onay' ? 'Karar onaylandı' : 'Karar ertelendi'); },
  'bi-tab'(d) { UI.biTab = d.tab; UI.confirmReset = false; },
  'bi-role'(d) { UI.biRole = d.role; },
  'list-add'(d) { getPath(CFG, d.path).push(NEW[d.path]()); reconcile(); },
  'list-del'(d) { getPath(CFG, d.path).splice(Number(d.i), 1); },
  'move-widget'(d) { const l = CFG.panels[d.role].widgets, i = Number(d.i), j = i + Number(d.dir); if (j >= 0 && j < l.length) [l[i], l[j]] = [l[j], l[i]]; },
  'node-restart'(d) { audit(who(), 'düğüm', `${roomById(d.id).name}: düğüm yeniden başlatıldı`); toast('Yeniden başlatma komutu gönderildi'); },
  'node-toggle'(d) { RT.nodesOff[d.id] = !RT.nodesOff[d.id]; audit(who(), 'düğüm', `${roomById(d.id).name}: düğüm ${RT.nodesOff[d.id] ? 'devre dışı bırakıldı' : 'etkinleştirildi'}`); },
  'svc-restart'(d) { audit(who(), 'servis', `${CFG.services.find(s => s.id === d.id).name} yeniden başlatıldı`); toast('Servis yeniden başlatıldı'); },
  'svc-toggle'(d) { RT.serviceDown[d.id] = !RT.serviceDown[d.id]; audit(who(), 'servis', `${CFG.services.find(s => s.id === d.id).name} ${RT.serviceDown[d.id] ? 'durduruldu' : 'başlatıldı'}`); },
  'logo-clear'(d) { CFG.brand[d.k] = null; },
  'export-copy'() { const t = $('#cfg-out'); t.select(); (navigator.clipboard ? navigator.clipboard.writeText(t.value) : Promise.reject()).then(() => toast('Kopyalandı'), () => toast('Metin seçildi, Ctrl+C ile kopyalayın')); return 'keep'; },
  import() { try { const v = JSON.parse($('#cfg-in').value); CFG = merge(clone(DEFAULTS), v); reconcile(); applyBrand(); toast('Yapılandırma uygulandı'); } catch { toast('Geçerli bir JSON değil'); return 'keep'; } },
  'reset-ask'() { UI.confirmReset = true; },
  'reset-cancel'() { UI.confirmReset = false; },
  'reset-do'() { CFG = clone(DEFAULTS); reconcile(); UI.confirmReset = false; applyBrand(); toast('Varsayılan ayarlar yüklendi'); },
  'clear-runtime'() { RT = freshRuntime(); toast('Talepler ve alarm işlemleri sıfırlandı'); },
  'clear-audit'() { RT.audit = []; }
};
const CHANGE = {
  clock(el) { UI.clock = el.value; el.blur(); },
  secmode(el) { RT.secMode[el.dataset.b] = el.value; audit(who(), 'güvenlik', `${buildingName(el.dataset.b)}: güvenlik modu ${el.options[el.selectedIndex].text}`); },
  'hoca-room'(el) { const l = CFG.panels.hoca.rooms, id = el.dataset.id, i = l.indexOf(id); if (el.checked && i < 0) l.push(id); if (!el.checked && i >= 0) l.splice(i, 1); }
};
const persist = () => { saveCfg(); saveRt(); saveUi(); };

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.matches('select,input')) return;
  if (el.dataset.act === 'modal-bg' && e.target !== el) return;       // arka plana tıklayınca kapat
  const fn = A[el.dataset.act === 'modal-bg' ? 'modal-close' : el.dataset.act]; if (!fn) return;
  const r = fn(el.dataset); persist(); if (r !== 'keep') render();
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.logo) {
    const f = el.files && el.files[0]; if (!f) return;
    logoFromFile(f).then(url => { CFG.brand[el.dataset.logo] = url; persist(); render(); toast('Logo güncellendi'); }, () => toast('Görsel okunamadı'));
    return;
  }
  if (el.dataset.actChange) { CHANGE[el.dataset.actChange](el); persist(); render(); return; }
  if (el.dataset.bind) {
    const v = el.type === 'checkbox' ? el.checked : el.dataset.type === 'number' ? Number(el.value) : el.value;
    setPath(CFG, el.dataset.bind, v); persist();
    if (el.dataset.bind.startsWith('brand.')) { applyBrand(); $('.side').outerHTML = sideHtml(route()); }
  }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form="request"]'); if (!f) return; e.preventDefault();
  const d = Object.fromEntries(new FormData(f));
  if (d.type === 'mesai' && toMin(d.end) <= toMin(d.start)) { toast('Bitiş saati başlangıçtan sonra olmalı'); return; }
  RT.requests.unshift({ id: uid('r'), type: d.type, room: d.room, who: 'Öğretim Üyesi', start: d.start, end: d.end, text: d.text.trim() || 'Açıklama girilmedi', status: 'bekliyor', at: hhmm(nowMin()) });
  audit(who(), 'talep', `${reqType(d.type)} gönderildi: ${roomById(d.room).name}`);
  toast(d.type === 'mesai' ? 'Talep dekanlığa iletildi' : 'Arıza bildirimi Bilgi İşlem birimine iletildi');
  persist(); render();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && UI.modal) { UI.modal = null; render(); } });
window.addEventListener('hashchange', () => { UI.modal = null; render(); window.scrollTo(0, 0); });

function logoFromFile(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader(); fr.onerror = rej;
    fr.onload = () => { const img = new Image(); img.onerror = rej;
      img.onload = () => { const w = img.naturalWidth || 300, h = img.naturalHeight || 300, k = Math.min(1, 320 / Math.max(w, h));
        const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/png')); };
      img.src = fr.result; };
    fr.readAsDataURL(file);
  });
}

/* canlı güncelleme: form alanı açıkken veya pencere açıkken ekranı yenileme */
function tick() {
  const a = document.activeElement;
  if (UI.modal || (a && a.matches('input,textarea,select'))) return;
  if (route() === 'bilgi-islem' && ['rules', 'brand', 'panels', 'content', 'rooms', 'users', 'config'].includes(UI.biTab)) return;
  render();
}

/* ----- başlat ----- */
reconcile(); applyBrand(); render();
setInterval(tick, 10000);
})();
</script>

</body></html>
